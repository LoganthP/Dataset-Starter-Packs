<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="Describe → Discover → Inspect → Run → Build">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="210" rx="20" fill="url(#bg)"/>

  <!-- connectors with travelling pulses -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#c7d2fe" stroke-width="3">
      <line x1="208" y1="92" x2="262" y2="92"/>
      <line x1="438" y1="92" x2="492" y2="92"/>
      <line x1="668" y1="92" x2="722" y2="92"/>
      <line x1="898" y1="92" x2="952" y2="92"/>
    </g>
    <g stroke="#6366f1" stroke-width="3" stroke-dasharray="12 60">
      <line x1="208" y1="92" x2="262" y2="92"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.2s" repeatCount="indefinite"/></line>
      <line x1="438" y1="92" x2="492" y2="92"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></line>
      <line x1="668" y1="92" x2="722" y2="92"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></line>
      <line x1="898" y1="92" x2="952" y2="92"><animate attributeName="stroke-dashoffset" values="72;0" dur="1.2s" begin="0.9s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- 1 Describe -->
    <g transform="translate(32 40)" filter="url(#shadow)">
      <rect width="176" height="104" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
      <circle cx="88" cy="32" r="16" fill="#e0e7ff"><animate attributeName="r" values="16;18;16" dur="2.5s" repeatCount="indefinite"/></circle>
      <text x="88" y="37" font-size="14" font-weight="800" fill="#4f46e5">1</text>
      <text x="88" y="70" font-size="16" font-weight="800" fill="#1e1b4b">Describe</text>
      <text x="88" y="90" font-size="12" fill="#64748b">your project in words</text>
    </g>
    <!-- 2 Discover -->
    <g transform="translate(262 40)" filter="url(#shadow)">
      <rect width="176" height="104" rx="16" fill="#ffffff" stroke="#99f6e4"/>
      <circle cx="88" cy="32" r="16" fill="#ccfbf1"><animate attributeName="r" values="16;18;16" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
      <text x="88" y="37" font-size="14" font-weight="800" fill="#0d9488">2</text>
      <text x="88" y="70" font-size="16" font-weight="800" fill="#1e1b4b">Discover</text>
      <text x="88" y="90" font-size="12" fill="#64748b">catalog + live sources</text>
    </g>
    <!-- 3 Inspect -->
    <g transform="translate(492 40)" filter="url(#shadow)">
      <rect width="176" height="104" rx="16" fill="#ffffff" stroke="#fde68a"/>
      <circle cx="88" cy="32" r="16" fill="#fef3c7"><animate attributeName="r" values="16;18;16" dur="2.5s" begin="1s" repeatCount="indefinite"/></circle>
      <text x="88" y="37" font-size="14" font-weight="800" fill="#b45309">3</text>
      <text x="88" y="70" font-size="16" font-weight="800" fill="#1e1b4b">Inspect</text>
      <text x="88" y="90" font-size="12" fill="#64748b">fit, schema, license</text>
    </g>
    <!-- 4 Run -->
    <g transform="translate(722 40)" filter="url(#shadow)">
      <rect width="176" height="104" rx="16" fill="#ffffff" stroke="#fbcfe8"/>
      <circle cx="88" cy="32" r="16" fill="#fce7f3"><animate attributeName="r" values="16;18;16" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></circle>
      <text x="88" y="37" font-size="14" font-weight="800" fill="#db2777">4</text>
      <text x="88" y="70" font-size="16" font-weight="800" fill="#1e1b4b">Run</text>
      <text x="88" y="90" font-size="12" fill="#64748b">sample or full analysis</text>
    </g>
    <!-- 5 Build -->
    <g transform="translate(952 40)" filter="url(#shadow)">
      <rect width="216" height="104" rx="16" fill="#6366f1"/>
      <circle cx="108" cy="32" r="16" fill="#818cf8"><animate attributeName="r" values="16;18;16" dur="2.5s" begin="2s" repeatCount="indefinite"/></circle>
      <text x="108" y="37" font-size="14" font-weight="800" fill="#ffffff">5</text>
      <text x="108" y="70" font-size="16" font-weight="800" fill="#ffffff">Build</text>
      <text x="108" y="90" font-size="12" fill="#e0e7ff">notebook → your own project</text>
    </g>
  </g>

  <text x="600" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#64748b">Every claim is <tspan font-weight="700" fill="#4f46e5">verified</tspan>, <tspan font-weight="700" fill="#0d9488">provider-reported</tspan> or <tspan font-weight="700" fill="#b45309">unknown</tspan> — unknown is shown, never guessed.</text>
</svg>
