<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors src/lib/theme.ts.
      (function () {
        try {
          var pref = localStorage.getItem("dsp:theme") || "system";
          var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Ready-to-run NASA, UCI, and Kaggle projects with starter notebooks, data dictionaries, baseline results, and extension challenges." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dataset Starter Packs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
