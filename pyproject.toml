# The Python project for deployment platforms (Vercel reads [project] and [tool.vercel]).
# Local development uses backend/requirements.txt; Docker uses backend/requirements-api.txt + requirements-packs.txt.
[project]
name = "dataset-starter-packs"
version = "0.5.0"
description = "Find a dataset by describing your project, analyze it, and start from curated starter packs."
requires-python = ">=3.12"
# Keep in sync with backend/requirements-api.txt + requirements-packs.txt: starter-pack samples run inside the site on Vercel.
dependencies = [
  "fastapi==0.163.2",
  "python-multipart==0.0.32",
  "pandas==3.0.5",
  "duckdb==2.0.0",
  "openpyxl==3.1.5",
  "nbformat==5.11.1",
  "pillow==12.3.0",
  "cryptography==50.0.1",
  "unlzw3==0.2.3",
  "psycopg[binary]==3.3.9",
  "numpy==2.5.3",
  "matplotlib==3.11.2",
  "scikit-learn==1.9.1",
  "kagglehub==1.0.3",
  # Readers for more file formats (formats/convert.py): Excel 97-2003, OpenDocument, HDF5 / NetCDF-4.
  # SPSS (pyreadstat) and 7-Zip (py7zr) are in requirements-api.txt for Docker only: the Vercel bundle is near its 500 MB limit.
  "xlrd==2.0.2",
  "odfpy==1.4.1",
  "h5py==3.16.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["frontend", "pack-template", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["app", "load_data", "analysis"]
