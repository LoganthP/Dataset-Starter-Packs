name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Packs, notebooks and API
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Lint
        run: ruff check .
      - name: Validate pack metadata, catalog records and README catalog
        run: python scripts/validate_catalog.py
      - name: Search benchmark (top-5 hits, zero hard-filter violations)
        run: python scripts/search_benchmark.py
      - name: Pack tests + notebooks (sample mode, each pack copied out of the repo)
        run: python scripts/run_pack_tests.py --isolated --notebooks
      - name: API tests
        working-directory: backend
        run: python -m pytest -q tests

  pack-independence:
    name: Each pack installs from its own requirements
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pack: [uci-bike-demand, nasa-bengaluru-weather, nasa-exoplanets, uci-dry-bean, kaggle-olist-delivery]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Fresh venv with only this pack's dependencies
        run: |
          cp -r packs/${{ matrix.pack }} /tmp/pack && cd /tmp/pack
          python -m venv .venv && . .venv/bin/activate
          pip install -r requirements.txt
          python -m pytest -q tests
          python analysis.py --mode sample --out /tmp/out && test -f /tmp/out/results.json

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
