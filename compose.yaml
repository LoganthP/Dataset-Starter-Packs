# Start:   docker compose up -d --build        then open http://localhost:8000
# Stop:    docker compose down                 (data stays in the "dsp-data" volume)
# Reset:   docker compose down -v              (deletes analyses, comparisons and downloads)
# Worker:  docker compose --profile worker up -d --build
#          Runs analyses in a separate container (DSP_RUN_MODE=queue). Without the profile, the app runs them itself.
services:
  app:
    build: .
    image: dataset-starter-packs:latest
    ports:
      - "${DSP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DSP_STATE_DIR: /data/state
    volumes:
      - dsp-data:/data
    restart: unless-stopped

  worker:
    profiles: ["worker"]
    image: dataset-starter-packs:latest
    command: ["python", "-m", "app.worker"]
    working_dir: /app/backend
    env_file:
      - path: .env
        required: false
    environment:
      DSP_STATE_DIR: /data/state
      DSP_RUN_MODE: queue
    volumes:
      - dsp-data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dsp-data:
